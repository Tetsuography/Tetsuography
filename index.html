<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tetsuography</title>
  <meta name="description" content="Photography portfolio by Tetsu." />
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light only">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- OpenGraph -->
  <meta property="og:title" content="Tetsuography">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tetsuography.com">
  <meta property="og:image" content="images/001.jpg">
  <meta property="og:description" content="Photography portfolio by Tetsu.">
</head>
<body>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Home">Tetsuography</a>
      <button
        class="mobile-menu-toggle"
        id="mobileMenuToggle"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="mobileMenu"
        type="button"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav" aria-label="Primary">
        <a class="nav-link" href="about.html">about</a>
        <a class="nav-link nav-instagram" href="https://www.instagram.com/tetsuography/" target="_blank" rel="noopener noreferrer">instagram</a>
      </nav>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="about.html">about</a>
      <a href="https://www.instagram.com/tetsuography/" target="_blank" rel="noopener noreferrer">instagram</a>
    </div>
  </header>

  <main class="page" role="main">
    <section class="gallery" aria-label="Photo gallery">
      <div class="container">
        <div id="masonry" class="masonry" aria-live="polite">
          <p id="js-check" style="padding:40px 20px;font-family:sans-serif;color:#999;font-size:14px">Loading photos...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Image viewer">
    <button class="lightbox-close" id="lbClose" aria-label="Close (Esc)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6L18 18M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="lightbox-nav lightbox-prev" id="lbPrev" aria-label="Previous (←)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 18L9 12L15 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="lightbox-nav lightbox-next" id="lbNext" aria-label="Next (→)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 18L15 12L9 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="lightbox-stage" role="document">
      <img id="lbImg" alt="" />
    </div>
  </div>

  <!-- Custom cursor (magnifier) -->
  <div class="custom-cursor" id="cursor" aria-hidden="true"></div>

  <script>
    window.__status = document.createElement('div');
    window.__status.style.cssText = 'position:fixed;bottom:10px;left:10px;background:red;color:white;padding:8px 12px;font-size:13px;font-family:sans-serif;z-index:9999;border-radius:4px';
    window.__status.textContent = 'Stage A: inline before OK';
    document.body.appendChild(window.__status);
    console.log('[T] Stage A: inline before OK');
  </script>
  <script src="script.js?v=5" onerror="window.__status.textContent='FAILED: script.js did not load'; window.__status.style.background='red';" onload="console.log('[T] script.js loaded')"></script>
  <script>
    if(window.__status) window.__status.textContent = 'Stage B: after external script';
    console.log('[T] Stage B: after external script');
  </script>

</body>
</html>
